plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven {
		name = "Jared's maven"
		url = "https://maven.blamejared.com/"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"terf-recipes" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// JEI (Minecraft 26.1+ n'est plus obfusqué : les configurations "mod*" de Loom ne sont plus
	// branchées sur le classpath de compilation, on utilise donc les configurations Gradle standard)
	compileOnly "mezz.jei:jei-${project.minecraft_version}-common-api:${project.jei_version}"
	compileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	// JEI complet en runClient pour tester directement dans l'environnement de dev
	localRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"
}

// Index of the datapack's recipe files, bundled with them (see DatapackSource.Bundled)
def terfRecipeIndex = tasks.register("terfRecipeIndex") {
	def dataDir = file("TERF_datapack/data")
	def indexFile = layout.buildDirectory.file("generated/terf/recipes.index")
	inputs.files(fileTree(dataDir) { include "*/recipe/**/*.json" })
	outputs.file(indexFile)
	doLast {
		def out = indexFile.get().asFile
		out.parentFile.mkdirs()
		def lines = []
		if (dataDir.isDirectory()) {
			dataDir.eachFileRecurse { f ->
				def rel = dataDir.toPath().relativize(f.toPath()).toString().replace('\\', '/')
				if (f.isFile() && rel ==~ /[^\/]+\/recipe\/.+\.json/) lines << "data/" + rel
			}
		}
		out.text = lines.sort().join("\n")
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Copie du datapack TERF embarquée dans le jar : c'est la source de secours quand le mod
	// ne trouve le datapack nulle part ailleurs (serveur sans resource pack combiné, etc.).
	// Elle est reprise à chaque build depuis le dossier TERF_datapack.
	from("TERF_datapack/data/terf/function") {
		include "startup.mcfunction"
		include "entity/machines/**/*.mcfunction"
		include "require/**/*.mcfunction"
		into "terf-recipes/datapack/data/terf/function"
	}
	// tags de blocs utilisés par les structures des machines (ex. #terf:redstoneactive)
	from("TERF_datapack/data/terf/tags/block") {
		into "terf-recipes/datapack/data/terf/tags/block"
	}
	// recettes de table de craft / four / tailleur du datapack (affichées dans JEI sur les serveurs)
	from("TERF_datapack/data") {
		include "*/recipe/**/*.json"
		into "terf-recipes/datapack/data"
	}
	// liste de ces recettes (un jar ne peut pas être listé)
	from(terfRecipeIndex) {
		into "terf-recipes/datapack"
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
	from("NOTICE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
